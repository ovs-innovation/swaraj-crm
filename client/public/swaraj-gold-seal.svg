<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" width="320" height="320">
  <defs>
    <!-- Metallic Gold Gradients -->
    <linearGradient id="goldOuter" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#CA9E3C"/>
      <stop offset="25%" stop-color="#FDF0A6"/>
      <stop offset="50%" stop-color="#B8861B"/>
      <stop offset="75%" stop-color="#FAE184"/>
      <stop offset="100%" stop-color="#8B6508"/>
    </linearGradient>
    <linearGradient id="goldInner" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFE885"/>
      <stop offset="35%" stop-color="#C69214"/>
      <stop offset="70%" stop-color="#FFF2A3"/>
      <stop offset="100%" stop-color="#996515"/>
    </linearGradient>
    <radialGradient id="darkCenter" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2a241b"/>
      <stop offset="70%" stop-color="#14110d"/>
      <stop offset="100%" stop-color="#080705"/>
    </radialGradient>
    <filter id="badgeShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.45"/>
    </filter>

    <!-- Curved Text Paths -->
    <!-- Top Arc (radius 106, center 160, 160) from 205 deg to -25 deg -->
    <path id="topArc" d="M 60,160 A 100,100 0 1,1 260,160" fill="none"/>
    <!-- Bottom Arc (radius 106, center 160, 160) along bottom -->
    <path id="botArc" d="M 60,160 A 100,100 0 0,0 260,160" fill="none"/>
  </defs>

  <g filter="url(#badgeShadow)">
    <!-- Scalloped / Gear Sprocket Outer Teeth -->
    <g transform="translate(160, 160)">
      <!-- 24 teeth ring -->
      <circle r="152" fill="url(#goldOuter)"/>
      <g fill="url(#goldOuter)">
        <polygon points="-8,-158 8,-158 5,-148 -5,-148" />
        <polygon points="-8,-158 8,-158 5,-148 -5,-148" transform="rotate(15)" />
        <polygon points="-8,-158 8,-158 5,-148 -5,-148" transform="rotate(30)" />
        <polygon points="-8,-158 8,-158 5,-148 -5,-148" transform="rotate(45)" />
        <polygon points="-8,-158 8,-158 5,-148 -5,-148" transform="rotate(60)" />
        <polygon points="-8,-158 8,-158 5,-148 -5,-148" transform="rotate(75)" />
        <polygon points="-8,-158 8,-158 5,-148 -5,-148" transform="rotate(90)" />
        <polygon points="-8,-158 8,-158 5,-148 -5,-148" transform="rotate(105)" />
        <polygon points="-8,-158 8,-158 5,-148 -5,-148" transform="rotate(120)" />
        <polygon points="-8,-158 8,-158 5,-148 -5,-148" transform="rotate(135)" />
        <polygon points="-8,-158 8,-158 5,-148 -5,-148" transform="rotate(150)" />
        <polygon points="-8,-158 8,-158 5,-148 -5,-148" transform="rotate(165)" />
        <polygon points="-8,-158 8,-158 5,-148 -5,-148" transform="rotate(180)" />
        <polygon points="-8,-158 8,-158 5,-148 -5,-148" transform="rotate(195)" />
        <polygon points="-8,-158 8,-158 5,-148 -5,-148" transform="rotate(210)" />
        <polygon points="-8,-158 8,-158 5,-148 -5,-148" transform="rotate(225)" />
        <polygon points="-8,-158 8,-158 5,-148 -5,-148" transform="rotate(240)" />
        <polygon points="-8,-158 8,-158 5,-148 -5,-148" transform="rotate(255)" />
        <polygon points="-8,-158 8,-158 5,-148 -5,-148" transform="rotate(270)" />
        <polygon points="-8,-158 8,-158 5,-148 -5,-148" transform="rotate(285)" />
        <polygon points="-8,-158 8,-158 5,-148 -5,-148" transform="rotate(300)" />
        <polygon points="-8,-158 8,-158 5,-148 -5,-148" transform="rotate(315)" />
        <polygon points="-8,-158 8,-158 5,-148 -5,-148" transform="rotate(330)" />
        <polygon points="-8,-158 8,-158 5,-148 -5,-148" transform="rotate(345)" />
      </g>
    </g>

    <!-- Outer Gold Rim -->
    <circle cx="160" cy="160" r="144" fill="#6B440D"/>
    <circle cx="160" cy="160" r="140" fill="url(#goldOuter)"/>
    <circle cx="160" cy="160" r="132" fill="#3D2908"/>

    <!-- Text Ring Band -->
    <circle cx="160" cy="160" r="128" fill="#14110d"/>

    <!-- Curved Text: SOLID POWER -->
    <text font-family="'Arial Black', Impact, sans-serif" font-weight="900" font-size="19" fill="url(#goldInner)" letter-spacing="4">
      <textPath href="#topArc" startOffset="50%" text-anchor="middle">
        ★ SOLID POWER ★
      </textPath>
    </text>

    <!-- Curved Text: SOLID BHAROSA -->
    <text font-family="'Arial Black', Impact, sans-serif" font-weight="900" font-size="19" fill="url(#goldInner)" letter-spacing="4">
      <textPath href="#botArc" startOffset="50%" text-anchor="middle">
        ★ SOLID BHAROSA ★
      </textPath>
    </text>

    <!-- Inner Gold Ring -->
    <circle cx="160" cy="160" r="82" fill="url(#goldOuter)"/>
    <circle cx="160" cy="160" r="78" fill="#523605"/>
    <circle cx="160" cy="160" r="74" fill="url(#darkCenter)"/>

    <!-- Center Badge Content -->
    <!-- Upper accent arc / gear lines -->
    <path d="M 120,118 Q 160,110 200,118" stroke="url(#goldInner)" stroke-width="2" fill="none" opacity="0.7"/>

    <!-- Center SWARAJ Text -->
    <text x="160" y="156" font-family="'Arial Black', Impact, 'Oswald', sans-serif" font-weight="900" font-size="28" fill="#000000" text-anchor="middle" letter-spacing="2">SWARAJ</text>
    <text x="160" y="154" font-family="'Arial Black', Impact, 'Oswald', sans-serif" font-weight="900" font-size="28" fill="url(#goldInner)" text-anchor="middle" letter-spacing="2">SWARAJ</text>

    <!-- SINCE 1974 -->
    <rect x="105" y="166" width="110" height="18" rx="4" fill="url(#goldOuter)"/>
    <text x="160" y="180" font-family="'Arial Black', sans-serif" font-weight="900" font-size="11.5" fill="#14110d" text-anchor="middle" letter-spacing="1.5">SINCE 1974</text>

    <!-- Lower accent flourish -->
    <path d="M 125,198 Q 160,204 195,198" stroke="url(#goldInner)" stroke-width="2" fill="none" opacity="0.7"/>
    <circle cx="160" cy="202" r="3" fill="url(#goldInner)"/>
  </g>
</svg>
