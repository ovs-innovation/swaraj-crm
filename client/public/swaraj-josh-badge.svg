<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" width="320" height="180">
  <defs>
    <filter id="glowFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <g filter="url(#glowFilter)" transform="rotate(-3, 160, 90)">
    <!-- Top Brush Script: JOSH KA -->
    <g transform="translate(18, 12)">
      <!-- Thick White Underlay / Stroke for high contrast readability on any background -->
      <text x="140" y="44" font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" font-style="italic" font-size="42" fill="none" stroke="#ffffff" stroke-width="9" stroke-linejoin="round" text-anchor="middle" letter-spacing="2">
        JOSH KA
      </text>
      <!-- Green Vibrant Text -->
      <text x="140" y="44" font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" font-style="italic" font-size="42" fill="#008744" text-anchor="middle" letter-spacing="2">
        JOSH KA
      </text>

      <!-- Second Line: MERA RAAZ -->
      <text x="175" y="82" font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" font-style="italic" font-size="34" fill="none" stroke="#ffffff" stroke-width="8" stroke-linejoin="round" text-anchor="middle" letter-spacing="2">
        MERA RAAZ
      </text>
      <text x="175" y="82" font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" font-style="italic" font-size="34" fill="#008744" text-anchor="middle" letter-spacing="2">
        MERA RAAZ
      </text>
    </g>

    <!-- Swaraj Brand Box (Bottom) -->
    <g transform="translate(68, 106)">
      <!-- White background pill with green border -->
      <rect x="0" y="0" width="200" height="48" rx="8" fill="#ffffff" stroke="#008744" stroke-width="3"/>
      <!-- Inner accent line -->
      <rect x="3" y="3" width="194" height="42" rx="6" fill="#ffffff"/>
      <!-- SWARAJ Text inside box -->
      <text x="100" y="34" font-family="'Arial Black', Impact, sans-serif" font-weight="900" font-size="28" fill="#008744" text-anchor="middle" letter-spacing="2">
        SWARAJ
      </text>
    </g>
  </g>
</svg>
