name: Deploy Swaraj CRM to Hostinger VPS

on:
  push:
    branches:
      - main

concurrency:
  group: deploy-swaraj-crm
  cancel-in-progress: false

jobs:
  deploy:
    name: Build & Deploy to Hostinger VPS
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      # Step 1: Pre-verify frontend build in runner
      - name: Verify Client Build
        run: |
          cd client
          npm ci || npm install
          npm run build

      # Step 2: Deploy to VPS using Native OpenSSH
      - name: Deploy to Hostinger VPS
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
          HOST: ${{ secrets.HOST }}
          USERNAME: ${{ secrets.USERNAME }}
        run: |
          mkdir -p ~/.ssh

          # Automatically strip leading spaces, trailing spaces, and Windows carriage returns
          echo "$SSH_KEY" | sed -e 's/^[[:blank:]]*//' -e 's/[[:blank:]]*$//' | tr -d '\r' > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          # Clean variables
          CLEAN_USER=$(echo "${USERNAME:-root}" | tr -d '\r\n[:space:]')
          CLEAN_HOST=$(echo "${HOST:-72.60.111.212}" | tr -d '\r\n[:space:]')

          echo "Connecting to $CLEAN_USER@$CLEAN_HOST..."

          ssh -o StrictHostKeyChecking=no -i ~/.ssh/deploy_key "$CLEAN_USER@$CLEAN_HOST" "bash -s" << 'EOF'
            set -e

            echo "=== Step 1: Navigating to project directory ==="
            cd /var/www/swaraj-crm/swaraj-crm

            echo "=== Step 2: Pulling latest changes from main ==="
            git fetch origin main
            git reset --hard origin/main

            echo "=== Step 3: Updating Backend Dependencies ==="
            cd server
            npm install --omit=dev

            echo "=== Step 4: Restarting PM2 Backend ==="
            export PATH=$PATH:/usr/local/bin:/usr/bin:~/.nvm/versions/node/$(ls ~/.nvm/versions/node 2>/dev/null | tail -n 1)/bin
            pm2 reload swaraj-crm-backend --update-env || pm2 restart swaraj-crm-backend
            pm2 save

            echo "=== Step 5: Building Frontend Client on VPS ==="
            cd ../client
            npm install
            npm run build

            echo "=== Step 6: Reloading Nginx ==="
            if command -v nginx > /dev/null 2>&1; then
              nginx -t && systemctl reload nginx
            fi

            echo "=== DEPLOYMENT COMPLETED SUCCESSFULLY ==="
          EOF
